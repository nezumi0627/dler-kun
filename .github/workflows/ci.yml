name: CI

on:
  push:
    branches: [main, v2-rewrite]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: python -m ruff check src/dler_kun2 tests
      - name: Type check
        run: python -m basedpyright
      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: CLI smoke checks
        run: |
          python -m dler_kun2 --help
          python -m dler_kun2 sites --json
      - name: Build wheel
        run: python -m build
