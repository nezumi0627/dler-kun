[project]
name = "dler-kun"
version = "0.1.0"
description = "Unified downloader platform for existing downloader engines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "nezumi0627" }]
dependencies = [
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.0",
    "aiohttp-socks>=0.10.0",
    "rich>=13.0.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
dler-kun = "dler_kun.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src/dler_kun", "tests"]
exclude = ["src/dler_kun/vendor", "**/__pycache__", ".venv"]
extraPaths = ["src", "src/dler_kun/vendor/gofile", "src/dler_kun/vendor/xo85"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pyright]
include = ["src/dler_kun", "tests"]
exclude = ["src/dler_kun/vendor", "**/__pycache__", ".venv"]
extraPaths = ["src", "src/dler_kun/vendor/gofile", "src/dler_kun/vendor/xo85"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.hatch.build.targets.wheel]
packages = ["src/dler_kun"]
